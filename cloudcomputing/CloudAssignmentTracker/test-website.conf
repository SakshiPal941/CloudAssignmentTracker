server {
	listen 80;

	# server_name sets which hostname must appear in the request's Host
	# header to match this server block. For the default server (this
	# file) this value is not decisive, as it's used as the last resort
	# regardless. However, you should set it for any further server
	# block explicitly.
	#server_name www.example.com;

	root /vagrant/Frontend;
	index index.html;

	location / {
		try_files $uri $uri/ =404;
	}

	# Proxy any /api/... requests through to the Spring Boot backend,
	# so the frontend JavaScript can call /api/... with no CORS setup.
	location /api/ {
		proxy_pass http://localhost:8080;
		proxy_set_header Host $host;
	}

	# Available log levels: debug, info, notice, warn, error, crit, alert, emerg.
	error_log /var/log/nginx/error.log warn;
	access_log /var/log/nginx/access.log;
}

