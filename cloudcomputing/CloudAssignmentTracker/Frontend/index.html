<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Assignment Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="dashboard-container">

    <div class="topbar"></div>

    <header>
        <div class="brand">
            <span class="brand-mark">☁ welcome to your assignment tracker</span>
            <h1>Assignment Tracker</h1>
        </div>
        <div class="vm-status">
            <span class="pulse-dot"></span>
            <span>Loading Data</span>
        </div>
    </header>

    <main>
        <div class="section-head">
            <h2>Current assignments</h2>
            <span class="row-count" id="row-count"></span>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Assignment name</th>
                    <th>Status</th>
                </tr>
            </thead>

            <tbody id="assignment-rows">
                <tr>
                    <td colspan="2" class="loading-row">
                        <span class="pulse-dot small"></span> Loading assignments&hellip;
                    </td>
                </tr>
            </tbody>
        </table>
    </main>

</div>

<script src="app.js"></script>
<script src="status-enhance.js"></script>
</body>
</html>
